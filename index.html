<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2f78b7">
<link rel="manifest" href="manifest.json">
<title>Mission Control</title>
<style>
:root{
  --bg:#eef4f8;
  --card:#ffffff;
  --ink:#17324a;
  --muted:#6d7d8a;
  --blue:#2f78b7;
  --blue-dark:#1d5b8e;
  --aqua:#dff3f7;
  --gold:#e7b85c;
  --green:#3c8f68;
  --line:#d6e0e7;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#f7fbfd,#e8f0f5);color:var(--ink)}
body{padding:0}
button,input,textarea{font:inherit}
.screen{display:none;min-height:100vh;padding:28px}
.screen.active{display:block}
.shell{max-width:1180px;margin:0 auto}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}
.brand{font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--blue-dark)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:white}
.lang button{border:0;background:transparent;padding:10px 16px;font-weight:800;cursor:pointer}
.lang button.active{background:var(--ink);color:white}
.hero-card,.panel,.material-card,.mission-card{
  background:var(--card);
  border:2px solid var(--ink);
  border-radius:26px;
  box-shadow:0 14px 34px rgba(23,50,74,.1)
}
.hero-card{padding:34px}
h1{font-size:clamp(2.5rem,6vw,5rem);line-height:.95;margin:0 0 12px}
h2{margin:0 0 14px}
p{line-height:1.5}
.lead{font-size:1.15rem;color:var(--muted);max-width:760px}
.primary{
  border:0;background:var(--blue);color:white;padding:14px 22px;border-radius:14px;
  font-weight:900;cursor:pointer;margin-top:18px
}
.primary:disabled{opacity:.4;cursor:not-allowed}
.mission-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.mission-card{overflow:hidden;cursor:pointer;transition:.2s}
.mission-card:hover{transform:translateY(-4px)}
.mission-image{
  height:240px;background-size:cover;background-position:center;
}
.moon{background-image:linear-gradient(rgba(0,0,0,.1),rgba(0,0,0,.2)),url('https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?auto=format&fit=crop&w=1200&q=80')}
.mars{background-image:linear-gradient(rgba(60,25,10,.04),rgba(60,25,10,.22)),url('images/mars-rover.webp');background-position:center 55%}
.ocean{background-image:linear-gradient(rgba(0,10,20,.2),rgba(0,10,20,.55)),url('https://images.unsplash.com/photo-1546026423-cc4642628d2b?auto=format&fit=crop&w=1200&q=80')}
.mission-copy{padding:20px}
.mission-copy p{color:var(--muted);margin-bottom:0}
.library-layout{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start}
.library-scroll{
  display:flex;gap:18px;overflow-x:auto;padding:4px 4px 18px;scroll-snap-type:x mandatory
}
.material-card{
  flex:0 0 390px;scroll-snap-align:start;padding:20px
}
.material-visual{
  height:180px;border:2px solid var(--ink);border-radius:20px;margin:14px 0;
  display:flex;align-items:center;justify-content:center;overflow:hidden
}
.felt{background:repeating-linear-gradient(35deg,#b9613e 0 4px,#d8845d 4px 8px)}
.foam{background:radial-gradient(circle,#fff 0 3px,transparent 4px),#f2c86b;background-size:24px 24px}
.bubble{background:radial-gradient(circle at center,rgba(255,255,255,.65) 0 28%,rgba(74,150,210,.4) 29% 40%,transparent 41%),#bfe6f5;background-size:58px 58px}
.mesh{background:linear-gradient(45deg,transparent 46%,#4e718a 47% 53%,transparent 54%),linear-gradient(-45deg,transparent 46%,#4e718a 47% 53%,transparent 54%),#d9edf5;background-size:32px 32px}
.neoprene{background:radial-gradient(circle,#5f6e78 0 4px,#2f3c45 5px 12px);background-size:28px 28px}
.foil{background:linear-gradient(135deg,#eef2f5,#aeb8c0,#f8fafb,#909aa3)}
.ripstop{background:linear-gradient(#c95f4d 1px,transparent 1px),linear-gradient(90deg,#c95f4d 1px,transparent 1px),#ef8d78;background-size:20px 20px}
.mylar{background:linear-gradient(135deg,#f7d46a,#fff2b7,#d4a62f,#fff7ca)}
.waterproof{background:linear-gradient(135deg,#347bb1,#6eb9d4)}
.metric{margin:15px 0}
.metric-head{display:flex;justify-content:space-between;font-weight:800;margin-bottom:7px}
.bar{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.bar span{height:18px;border-radius:6px;background:#fff;border:2px solid var(--ink)}
.bar span.fill{background:var(--gold)}
.inside{background:#f3f7f9;border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:16px}

.micro{
  height:118px;border-radius:14px;background:#14232f;position:relative;
  overflow:hidden;margin-top:10px;border:1px solid #294253
}
.structure-label{
  position:absolute;left:9px;bottom:7px;color:#d9edf7;font-size:.72rem;
  background:rgba(7,23,37,.72);padding:4px 7px;border-radius:7px
}
/* Felt: entangled fibers with air spaces */
.micro-felt .strand{position:absolute;width:175px;height:8px;border-radius:999px;background:#d8a36c}
.micro-felt .s1{top:15px;left:-18px;transform:rotate(18deg)}
.micro-felt .s2{top:44px;left:78px;transform:rotate(-25deg)}
.micro-felt .s3{top:74px;left:5px;transform:rotate(31deg)}
.micro-felt .s4{top:92px;left:110px;transform:rotate(-12deg)}
.micro-felt .pore{position:absolute;width:27px;height:27px;border:2px dashed #a9dff1;border-radius:50%}
.micro-felt .p1{left:62px;top:34px}.micro-felt .p2{right:48px;top:67px}

/* Foam: connected polymer walls surrounding gas-filled cells */
.micro-foam{
  background:
    radial-gradient(circle at 20% 30%,transparent 0 18px,#e0b469 19px 23px,transparent 24px),
    radial-gradient(circle at 53% 32%,transparent 0 22px,#e0b469 23px 27px,transparent 28px),
    radial-gradient(circle at 82% 30%,transparent 0 17px,#e0b469 18px 22px,transparent 23px),
    radial-gradient(circle at 34% 75%,transparent 0 24px,#e0b469 25px 29px,transparent 30px),
    radial-gradient(circle at 70% 75%,transparent 0 21px,#e0b469 22px 26px,transparent 27px),
    #14232f;
}

/* Bubble wrap: sealed air chambers held by thin polymer film */
.micro-bubble .film{position:absolute;left:0;right:0;height:7px;background:#8ec8e5}
.micro-bubble .film.top{top:24px}.micro-bubble .film.bottom{bottom:24px}
.micro-bubble .bubble-cell{
  position:absolute;width:55px;height:55px;border:4px solid #8ec8e5;border-radius:50%;
  top:31px;background:rgba(148,213,237,.08)
}
.micro-bubble .b1{left:34px}.micro-bubble .b2{left:126px}.micro-bubble .b3{right:34px}

/* Mesh: woven fibers with open gaps */
.micro-mesh{
  background:
    repeating-linear-gradient(45deg,transparent 0 18px,#7ab4cd 19px 24px,transparent 25px 43px),
    repeating-linear-gradient(-45deg,transparent 0 18px,#9bd0df 19px 24px,transparent 25px 43px),
    #14232f;
}

/* Neoprene: closed-cell polymer foam */
.micro-neoprene{
  background:
    radial-gradient(circle at 18% 30%,#24333d 0 15px,#748f9c 16px 20px,#24333d 21px),
    radial-gradient(circle at 48% 25%,#24333d 0 19px,#748f9c 20px 24px,#24333d 25px),
    radial-gradient(circle at 78% 32%,#24333d 0 16px,#748f9c 17px 21px,#24333d 22px),
    radial-gradient(circle at 31% 76%,#24333d 0 20px,#748f9c 21px 25px,#24333d 26px),
    radial-gradient(circle at 68% 75%,#24333d 0 18px,#748f9c 19px 23px,#24333d 24px),
    #14232f;
}

/* Aluminum foil: simplified metallic crystal grains */
.micro-foil{
  background:
    linear-gradient(35deg,transparent 47%,#aab6bd 48% 52%,transparent 53%),
    linear-gradient(-28deg,transparent 47%,#89979f 48% 52%,transparent 53%),
    linear-gradient(75deg,transparent 47%,#c6d0d5 48% 52%,transparent 53%),
    #6f7d85;
  background-size:72px 62px,88px 70px,96px 84px;
}
.micro-foil .atom{
  position:absolute;width:8px;height:8px;border-radius:50%;background:#e7eef1;
  box-shadow:20px 0 #e7eef1,40px 0 #e7eef1,60px 0 #e7eef1,80px 0 #e7eef1,
             10px 16px #e7eef1,30px 16px #e7eef1,50px 16px #e7eef1,70px 16px #e7eef1;
  left:24px;top:24px;opacity:.72
}

/* Ripstop: woven fabric with thicker reinforcing threads */
.micro-ripstop{
  background:
    repeating-linear-gradient(0deg,transparent 0 11px,#d47a68 12px 15px),
    repeating-linear-gradient(90deg,transparent 0 11px,#d47a68 12px 15px),
    linear-gradient(0deg,transparent 47%,#f0b08f 48% 53%,transparent 54%),
    linear-gradient(90deg,transparent 47%,#f0b08f 48% 53%,transparent 54%),
    #6f2f28;
  background-size:auto,auto,58px 58px,58px 58px;
}

/* Mylar: polymer film, often used with a thin reflective metal coating */
.micro-mylar .layer{position:absolute;left:18px;right:18px;border-radius:4px}
.micro-mylar .metal-layer{top:20px;height:13px;background:linear-gradient(90deg,#d6b243,#fff0a0,#b88b23)}
.micro-mylar .polymer-layer{top:39px;height:48px;background:#556f82}
.micro-mylar .chain{position:absolute;height:5px;width:180px;border-radius:999px;background:#a8d1df}
.micro-mylar .c1{top:50px;left:30px}.micro-mylar .c2{top:65px;left:82px}.micro-mylar .c3{top:80px;left:12px}

/* Waterproof fabric: textile substrate plus thin coating/membrane */
.micro-waterproof .coat{position:absolute;left:0;right:0;top:18px;height:18px;background:#53a9cf}
.micro-waterproof .weave{
  position:absolute;left:0;right:0;top:42px;bottom:0;
  background:
    repeating-linear-gradient(45deg,transparent 0 13px,#6d95ad 14px 19px,transparent 20px 33px),
    repeating-linear-gradient(-45deg,transparent 0 13px,#9bc4d7 14px 19px,transparent 20px 33px)
}
.card-actions{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.select-btn{border:0;background:var(--ink);color:white;border-radius:12px;padding:11px 15px;font-weight:900;cursor:pointer}
.material-card.selected{border-color:var(--green);box-shadow:0 0 0 4px rgba(60,143,104,.14)}
.material-card.selected .select-btn{background:var(--green)}
.side-panel{position:sticky;top:20px}
.panel{padding:20px}
.choice-list{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.choice{border:1px solid var(--line);border-radius:12px;padding:10px;background:#f7fafc}
.data-sheet{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.field{display:flex;flex-direction:column;gap:7px}
.field input,.field textarea,.field select{
  border:1px solid var(--line);border-radius:12px;padding:12px;background:white
}
.full{grid-column:1/-1}
.material-row{
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;padding:14px;border:1px solid var(--line);
  border-radius:14px;background:#f8fbfd
}
.material-row label{font-size:.85rem;font-weight:800;color:var(--muted)}
.material-thumb{width:54px;height:54px;border-radius:12px;border:1px solid var(--line);flex:0 0 54px}
.mission-report-header{padding:18px 20px;border-radius:18px;margin-bottom:18px;color:white}
.mission-report-header.moon-report{background:linear-gradient(135deg,#2f78b7,#6faed8)}
.mission-report-header.mars-report{background:linear-gradient(135deg,#b95d3a,#e18b63)}
.mission-report-header.sea-report{background:linear-gradient(135deg,#167d88,#49a9b1)}
.temp-difference{font-size:1.1rem;font-weight:900;color:var(--blue-dark);padding:12px 14px;border-radius:12px;background:#eef7fc;border:1px solid var(--line)}
.result-options{display:flex;flex-wrap:wrap;gap:10px}
.result-options label{border:1px solid var(--line);border-radius:999px;padding:10px 14px;background:white}
@media(max-width:900px){
  .mission-grid,.data-sheet{grid-template-columns:1fr}
  .library-layout{grid-template-columns:1fr}
  .side-panel{position:static}
  .material-row{grid-template-columns:1fr}
}
</style>
</head>
<body>

<section id="missionScreen" class="screen active">
  <div class="shell">
    <div class="topbar">
      <div class="brand">Mission Control</div>
      <div class="lang">
        <button data-lang="en" class="active">English</button>
        <button data-lang="es">Español</button>
      </div>
    </div>
    <div class="hero-card">
      <h1 id="missionHeading"></h1>
      <p id="missionHelp" class="lead"></p>
      <div class="mission-grid">
        <article class="mission-card" data-mission="Moon" data-station="Heat Lamp">
          <div class="mission-image moon"></div>
          <div class="mission-copy"><h2 id="moonTitle"></h2><p id="moonDesc"></p></div>
        </article>
        <article class="mission-card" data-mission="Mars" data-station="Wind Tunnel">
          <div class="mission-image mars"></div>
          <div class="mission-copy"><h2 id="marsTitle"></h2><p id="marsDesc"></p></div>
        </article>
        <article class="mission-card" data-mission="Deep Sea" data-station="Vacuum Chamber">
          <div class="mission-image ocean"></div>
          <div class="mission-copy"><h2 id="seaTitle"></h2><p id="seaDesc"></p></div>
        </article>
      </div>
    </div>
  </div>
</section>

<section id="libraryScreen" class="screen">
  <div class="shell">
    <div class="topbar">
      <div>
        <div class="brand" id="libraryTitle"></div>
        <div style="color:var(--muted);margin-top:4px"><span id="missionLabel"></span> · <span id="selectThree"></span></div>
      </div>
      <div class="lang">
        <button data-lang="en" class="active">English</button>
        <button data-lang="es">Español</button>
      </div>
    </div>

    <div class="library-layout">
      <div class="library-scroll" id="cards"></div>
      <aside class="side-panel">
        <div class="panel">
          <h2 id="yourMaterials"></h2>
          <div class="choice-list" id="choices"></div>
          <button class="primary" id="dataBtn" disabled></button>
        </div>
      </aside>
    </div>
  </div>
</section>

<section id="dataScreen" class="screen">
  <div class="shell">
    <div class="topbar">
      <div>
        <div class="brand" id="dataTitle"></div>
        <div style="color:var(--muted);margin-top:4px"><span id="dataMission"></span> · <span id="dataStation"></span></div>
      </div>
      <div class="lang">
        <button data-lang="en" class="active">English</button>
        <button data-lang="es">Español</button>
      </div>
    </div>

    <div class="panel">
      <div class="data-sheet">
        <div class="field">
          <label id="explorerLabel"></label>
          <input id="explorerName" type="text">
        </div>
        <div class="field">
          <label id="missionFieldLabel"></label>
          <input id="missionField" type="text" readonly>
        </div>

        <div class="full">
          <h2 id="selectedMaterialsHeading"></h2>
          <div id="materialRows"></div>
        </div>

        <div id="moonFields" class="full" style="display:none"></div>
        <div id="marsFields" class="full" style="display:none"></div>
        <div id="oceanFields" class="full" style="display:none"></div>

        <div class="field full">
          <label id="redesignLabel"></label>
          <textarea id="redesignText" rows="3"></textarea>
        </div>
      </div>
      <button class="primary" id="resetBtn"></button>
    </div>
  </div>
</section>

const materials=[
 {id:"felt",visual:"felt",structure:"felt",heat:3,wind:3,pressure:2},
 {id:"foam",visual:"foam",structure:"foam",heat:4,wind:4,pressure:2},
 {id:"bubble",visual:"bubble",structure:"bubble",heat:4,wind:4,pressure:1},
 {id:"mesh",visual:"mesh",structure:"mesh",heat:1,wind:1,pressure:2},
 {id:"neoprene",visual:"neoprene",structure:"neoprene",heat:4,wind:5,pressure:3},
 {id:"foil",visual:"foil",structure:"foil",heat:5,wind:4,pressure:2},
 {id:"ripstop",visual:"ripstop",structure:"ripstop",heat:2,wind:4,pressure:2},
 {id:"mylar",visual:"mylar",structure:"mylar",heat:5,wind:4,pressure:2},
 {id:"waterproof",visual:"waterproof",structure:"waterproof",heat:2,wind:5,pressure:3}
];

let lang="en", mission="", station="", selected=[];
const t=()=>I18N[lang];

function microMarkup(kind){
  if(kind==="felt") return '<span class="strand s1"></span><span class="strand s2"></span><span class="strand s3"></span><span class="strand s4"></span><span class="pore p1"></span><span class="pore p2"></span>';
  if(kind==="bubble") return '<span class="film top"></span><span class="film bottom"></span><span class="bubble-cell b1"></span><span class="bubble-cell b2"></span><span class="bubble-cell b3"></span>';
  if(kind==="foil") return '<span class="atom"></span>';
  if(kind==="mylar") return '<span class="layer metal-layer"></span><span class="layer polymer-layer"></span><span class="chain c1"></span><span class="chain c2"></span><span class="chain c3"></span>';
  if(kind==="waterproof") return '<span class="coat"></span><span class="weave"></span>';
  return '';
}
function bar(n){return Array.from({length:5},(_,i)=>`<span class="${i<n?'fill':''}"></span>`).join('')}

function syncLanguageButtons(){
 document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang));
 document.documentElement.lang=lang;
}

function translateStatic(){
 document.getElementById("missionHeading").textContent=t().missionHeading;
 document.getElementById("missionHelp").textContent=t().missionHelp;
 document.getElementById("moonTitle").textContent=t().moonTitle; document.getElementById("moonDesc").textContent=t().moonDesc;
 document.getElementById("marsTitle").textContent=t().marsTitle; document.getElementById("marsDesc").textContent=t().marsDesc;
 document.getElementById("seaTitle").textContent=t().seaTitle; document.getElementById("seaDesc").textContent=t().seaDesc;
 document.getElementById("libraryTitle").textContent=t().libraryTitle;
 document.getElementById("selectThree").textContent=t().selectThree;
 document.getElementById("yourMaterials").textContent=t().yourMaterials;
 document.getElementById("dataBtn").textContent=t().openData;
 document.getElementById("dataTitle").textContent=t().dataTitle;
 document.getElementById("explorerLabel").textContent=t().explorer;
 document.getElementById("explorerName").placeholder=t().explorer;
 document.getElementById("missionFieldLabel").textContent=t().mission;
 document.getElementById("selectedMaterialsHeading").textContent=t().selectedMaterials;
 document.getElementById("redesignLabel").textContent=t().redesign;
 document.getElementById("redesignText").placeholder=t().redesign;
 document.getElementById("resetBtn").textContent=t().reset;
 if(mission){
   document.getElementById("missionLabel").textContent=t().missionNames[mission];
   document.getElementById("dataMission").textContent=t().missionNames[mission];
   document.getElementById("dataStation").textContent=t().stations[station];
   document.getElementById("missionField").value=t().missionNames[mission];
 }
}

function renderCards(){
 const cards=document.getElementById("cards"); cards.innerHTML="";
 materials.forEach(m=>{
   const mt=MATERIAL_TEXT[lang][m.id];
   const card=document.createElement("article");
   card.className="material-card"+(selected.some(x=>x.id===m.id)?" selected":"");
   card.innerHTML=`
    <div style="color:var(--blue-dark);font-size:.8rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase">${mt[1]}</div>
    <h2 style="font-size:2.2rem;margin:6px 0">${mt[0]}</h2>
    <div class="material-visual ${m.visual}"></div>
    <div class="metric"><div class="metric-head"><span>${t().heat}</span><span>${m.heat}/5</span></div><div class="bar">${bar(m.heat)}</div></div>
    <div class="metric"><div class="metric-head"><span>${t().wind}</span><span>${m.wind}/5</span></div><div class="bar">${bar(m.wind)}</div></div>
    <div class="metric"><div class="metric-head"><span>${t().pressure}</span><span>${m.pressure}/5</span></div><div class="bar">${bar(m.pressure)}</div></div>
    <div class="inside"><strong>${t().inside}</strong>
      <div class="micro micro-${m.structure}">${microMarkup(m.structure)}<span class="structure-label">${t().simplified}</span></div>
      <p style="margin-bottom:0;color:var(--muted)">${mt[2]}.</p>
    </div>
    <p><strong>${t().realUses}</strong><br><span style="color:var(--muted)">${mt[3]}</span></p>
    <div class="card-actions"><span></span><button class="select-btn">${selected.some(x=>x.id===m.id)?t().selected:t().selectMaterial}</button></div>`;
   card.querySelector("button").onclick=()=>toggleMaterial(m);
   cards.appendChild(card);
 });
 renderChoices();
}

function toggleMaterial(m){
 const ix=selected.findIndex(x=>x.id===m.id);
 if(ix>=0) selected.splice(ix,1); else if(selected.length<3) selected.push(m);
 renderCards();
}

function renderChoices(){
 const box=document.getElementById("choices"); box.innerHTML="";
 for(let i=0;i<3;i++){
   const d=document.createElement("div"); d.className="choice";
   d.textContent=(i+1)+". "+(selected[i]?MATERIAL_TEXT[lang][selected[i].id][0]:t().notSelected);
   box.appendChild(d);
 }
 document.getElementById("dataBtn").disabled=selected.length!==3;
}

function show(id){
 document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
 document.getElementById(id).classList.add("active");
}

function selectMission(m,s){
 mission=m; station=s; translateStatic(); renderCards(); show("libraryScreen");
}

function ratingOptions(){
 return `<option>${t().low}</option><option>${t().medium}</option><option>${t().high}</option>`;
}

function openDataSheet(){
 translateStatic();
 const rows=document.getElementById("materialRows"); rows.innerHTML="";
 selected.forEach(m=>{
   const r=document.createElement("div"); r.className="material-row";
   r.innerHTML=`<div><label>${t().selectedMaterials}</label><div style="display:flex;align-items:center;gap:12px;margin-top:8px"><div class="material-thumb ${m.visual}"></div><strong>${MATERIAL_TEXT[lang][m.id][0]}</strong></div></div>
   <div><label>${t().prediction}</label><select>${ratingOptions()}</select></div>
   <div><label>${t().observed}</label><select>${ratingOptions()}</select></div>`;
   rows.appendChild(r);
 });
 document.getElementById("moonFields").style.display=mission==="Moon"?"block":"none";
 document.getElementById("marsFields").style.display=mission==="Mars"?"block":"none";
 document.getElementById("oceanFields").style.display=mission==="Deep Sea"?"block":"none";
 renderMissionReport();
 show("dataScreen");
}

function renderMissionReport(){
 if(mission==="Moon"){
   document.getElementById("moonFields").innerHTML=`<div class="mission-report-header moon-report"><strong>${t().missionNames.Moon}</strong><br><span>${t().moonReport}</span></div>
   <div class="data-sheet"><div class="field"><label>${t().prediction}</label><textarea rows="3" placeholder="${t().moonPred}"></textarea></div>
   <div class="field"><label>${t().observed}</label><textarea rows="3" placeholder="${t().moonObs}"></textarea></div>
   <div class="field"><label>${t().before}</label><input id="tempBefore" type="number" placeholder="°F"></div>
   <div class="field"><label>${t().after}</label><input id="tempAfter" type="number" placeholder="°F"></div>
   <div class="field full"><div class="temp-difference">${t().change}: <span id="tempDifference">—</span></div></div>
   <div class="field full"><label>${t().bestHeat}</label><input type="text" placeholder="${t().enterMaterial}"></div></div>`;
   const a=document.getElementById("tempBefore"), b=document.getElementById("tempAfter");
   const calc=()=>{const x=parseFloat(a.value),y=parseFloat(b.value);document.getElementById("tempDifference").textContent=(Number.isFinite(x)&&Number.isFinite(y))?`${y-x>=0?"+":""}${(y-x).toFixed(1)}°F`:"—";};
   a.oninput=calc;b.oninput=calc;
 }
 if(mission==="Mars"){
   document.getElementById("marsFields").innerHTML=`<div class="mission-report-header mars-report"><strong>${t().missionNames.Mars}</strong><br><span>${t().marsReport}</span></div>
   <div class="data-sheet"><div class="field"><label>${t().prediction}</label><textarea rows="3" placeholder="${t().marsPred}"></textarea></div>
   <div class="field"><label>${t().observed}</label><textarea rows="3" placeholder="${t().marsObs}"></textarea></div>
   <div class="field full"><label>${t().designResult}</label><div class="result-options" style="margin-top:10px">
   <label><input type="radio" name="wind"> ${t().stayed}</label><label><input type="radio" name="wind"> ${t().shifted}</label><label><input type="radio" name="wind"> ${t().loose}</label></div></div>
   <div class="field full"><label>${t().bestWind}</label><input type="text" placeholder="${t().enterMaterial}"></div></div>`;
 }
 if(mission==="Deep Sea"){
   document.getElementById("oceanFields").innerHTML=`<div class="mission-report-header sea-report"><strong>${t().missionNames["Deep Sea"]}</strong><br><span>${t().seaReport}</span></div>
   <div class="data-sheet"><div class="field"><label>${t().prediction}</label><textarea rows="3" placeholder="${t().seaPred}"></textarea></div>
   <div class="field"><label>${t().observed}</label><textarea rows="3" placeholder="${t().seaObs}"></textarea></div>
   <div class="field full"><label>${t().pressureResult}</label><div class="result-options" style="margin-top:10px">
   <label><input type="radio" name="pressure"> ${t().noChange}</label><label><input type="radio" name="pressure"> ${t().slight}</label><label><input type="radio" name="pressure"> ${t().major}</label></div></div>
   <div class="field full"><label>${t().bestPressure}</label><input type="text" placeholder="${t().enterMaterial}"></div></div>`;
 }
}

document.querySelectorAll(".mission-card").forEach(c=>c.onclick=()=>selectMission(c.dataset.mission,c.dataset.station));
document.getElementById("dataBtn").onclick=openDataSheet;
document.getElementById("resetBtn").onclick=()=>location.reload();
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{
 lang=b.dataset.lang; syncLanguageButtons(); translateStatic(); renderCards();
 if(document.getElementById("dataScreen").classList.contains("active")) openDataSheet();
});
syncLanguageButtons();translateStatic();renderCards();
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("service-worker.js"));
</script>
</body>
</html>
